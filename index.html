<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Legends of Death & the Reapers of Time</title>
  <link rel="stylesheet" href="styles/game.css" />
</head>
<body>
  <div id="handheld-shell">
    <!-- Top Status Header -->
    <header id="top-bar">
      <div class="brand">
        <span class="dot"></span>
        <span>LEGENDS OF DEATH</span>
      </div>
      <div id="location-pill">Colorado Springs</div>
      <button id="btn-menu-top" class="mini-btn" aria-label="Menu">QUESTS</button>
    </header>

    <!-- Main 32-bit GBA Viewport (384x256 internal resolution) -->
    <main id="screen-bezel">
      <div id="screen-wrap">
        <canvas id="game-canvas" width="384" height="256"></canvas>

        <!-- Cinematic Letterbox Bars for Cutscenes -->
        <div id="letterbox-top" class="letterbox"></div>
        <div id="letterbox-bottom" class="letterbox"></div>
        <div id="cutscene-badge">CUTSCENE</div>

        <!-- Active Quest Tracker Banner -->
        <div id="quest-hud">
          <span id="quest-act">ACT I</span>
          <span id="quest-text">Loading...</span>
        </div>

        <!-- Dialogue Overlay with 64x64 Pixel Portrait -->
        <div id="dialogue-box" class="hidden">
          <div id="portrait-frame">
            <canvas id="portrait-canvas" width="64" height="64"></canvas>
          </div>
          <div id="dialogue-content">
            <div id="dialogue-header">
              <span id="speaker-name">Jacob</span>
              <span id="speaker-role">Nephilim</span>
            </div>
            <p id="dialogue-text"></p>
            <div id="dialogue-next">▼ PRESS A</div>
          </div>
        </div>

        <!-- Choice Prompt Overlay -->
        <div id="choice-box" class="hidden"></div>

        <!-- Turn-Based Battle Overlay (Full-Body 32-bit Models) -->
        <div id="battle-ui" class="hidden">
          <div id="battle-top-hud">
            <div id="enemy-hud" class="stat-card">
              <div class="stat-row">
                <span id="enemy-name">Sendex</span>
                <span id="enemy-tag">Lv.18</span>
              </div>
              <div class="hp-bar-bg"><div id="enemy-hp-fill" class="hp-bar-fill"></div></div>
              <div id="enemy-hp-text" class="hp-text">180 / 180</div>
            </div>
          </div>

          <div id="battle-party-hud"></div>

          <div id="battle-bottom">
            <div id="battle-log">Battle started!</div>
            <div id="battle-actions"></div>
          </div>
        </div>

        <!-- Quest / Party / Lore Menu Overlay -->
        <div id="menu-overlay" class="hidden">
          <div class="menu-panel">
            <div class="menu-tabs">
              <button class="tab-btn active" data-tab="quests">Quests</button>
              <button class="tab-btn" data-tab="party">Party</button>
              <button class="tab-btn" data-tab="lore">Lore</button>
              <button class="tab-btn" data-tab="save">Save</button>
              <button id="menu-close" class="tab-close">✕</button>
            </div>
            <div id="menu-body"></div>
          </div>
        </div>

        <!-- Title Screen Overlay -->
        <div id="title-screen">
          <div class="title-emblem">✦ ⚔ ✦</div>
          <h1>LEGENDS OF DEATH</h1>
          <h2>&amp; THE REAPERS OF TIME</h2>
          <p class="title-sub">32-Bit Story RPG • Multi-File Edition</p>
          <div class="title-buttons">
            <button id="btn-new-game" class="primary-btn">NEW JOURNEY</button>
            <button id="btn-continue" class="secondary-btn hidden">CONTINUE</button>
          </div>
          <p class="title-hint">D-Pad / WASD to Move • A / Z / Enter to Interact</p>
        </div>

        <!-- Scene Transition Fade -->
        <div id="fade-layer"></div>
      </div>
    </main>

    <!-- Tactile Mobile / Handheld Controls -->
    <footer id="controls-deck">
      <div id="dpad" aria-label="Directional Pad">
        <button class="dpad-btn up" data-dir="up">▲</button>
        <button class="dpad-btn left" data-dir="left">◀</button>
        <div class="dpad-center"></div>
        <button class="dpad-btn right" data-dir="right">▶</button>
        <button class="dpad-btn down" data-dir="down">▼</button>
      </div>

      <div id="mid-controls">
        <button id="btn-realm" class="pill-btn">PURGATORIO</button>
        <button id="btn-menu" class="pill-btn">MENU</button>
      </div>

      <div id="ab-pad">
        <button id="btn-b" class="round-btn btn-b">B</button>
        <button id="btn-a" class="round-btn btn-a">A</button>
      </div>
    </footer>
  </div>

  <!-- Modular Project Scripts -->
  <script src="models/palettes.js"></script>
  <script src="models/sprites.js"></script>
  <script src="models/world_art.js"></script>
  <script src="scripts/story.js"></script>
  <script src="scripts/maps.js"></script>
  <script src="scripts/battle.js"></script>
  <script src="scripts/engine.js"></script>
</body>
</html>
