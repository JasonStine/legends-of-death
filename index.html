<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Legends of Death &amp; the Reapers of Time — 32-Bit GBA RPG</title>
  <style>
    :root {
      --shell-top: #261d3f;
      --shell-mid: #161026;
      --shell-bot: #0c0816;
      --shell-border: #44356e;
      --bezel: #090612;
      --gold: #f7c948;
      --purple: #9b5cff;
      --crimson: #e83b5c;
      --text: #f4f0fc;
      --muted: #a699c2;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background: radial-gradient(circle at 50% 15%, #23183d 0%, #07050d 100%);
      color: var(--text);
      font-family: 'Courier New', Courier, monospace;
      touch-action: none;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Handheld GBA-Style Console Shell */
    .console-shell {
      width: 100%;
      max-width: 520px;
      height: 100dvh;
      max-height: 920px;
      background: linear-gradient(165deg, var(--shell-top) 0%, var(--shell-mid) 55%, var(--shell-bot) 100%);
      border: 2px solid var(--shell-border);
      border-radius: 22px;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.85), inset 0 1px 2px rgba(255, 255, 255, 0.16);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 8px 10px max(10px, env(safe-area-inset-bottom));
    }

    @media (max-width: 540px) {
      .console-shell {
        border-radius: 0;
        border: none;
        max-height: 100dvh;
        padding: 6px 8px max(10px, env(safe-area-inset-bottom));
      }
    }

    /* Top Brand Bar */
    .console-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 2px 4px 5px;
      font-size: 10px;
      letter-spacing: 1px;
      color: var(--muted);
    }

    .led-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: bold;
    }

    .led {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4ade80;
      box-shadow: 0 0 8px #4ade80;
    }

    .top-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: var(--text);
      border-radius: 8px;
      padding: 3px 9px;
      font-size: 10px;
      font-family: inherit;
      cursor: pointer;
    }

    /* Screen Bezel & Persistent Quest HUD */
    .screen-bezel {
      background: var(--bezel);
      border: 3px solid #2e234d;
      border-radius: 14px;
      padding: 5px;
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.95);
      display: flex;
      flex-direction: column;
      gap: 5px;
      flex: 1 1 auto;
      min-height: 0;
    }

    .hud-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #140f24;
      border: 1px solid #392b5e;
      border-radius: 7px;
      padding: 4px 8px;
      gap: 6px;
      flex-shrink: 0;
    }

    .hud-left {
      display: flex;
      flex-direction: column;
      min-width: 0;
      flex: 1;
    }

    .hud-area {
      font-size: 11px;
      font-weight: bold;
      color: var(--gold);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .hud-quest {
      font-size: 9.5px;
      color: #e2daf5;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .hud-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      flex-shrink: 0;
    }

    .realm-badge {
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 9px;
      font-weight: bold;
      background: #1d4d38;
      color: #a7f3d0;
      border: 1px solid #34d399;
    }

    .realm-badge.purgatorio { background: #3b1761; color: #e9d5ff; border-color: #a855f7; }
    .realm-badge.dream      { background: #17305c; color: #bae6fd; border-color: #38bdf8; }
    .realm-badge.bloodmoon  { background: #5e1124; color: #fecdd3; border-color: #f43f5e; }

    .hud-hp {
      font-size: 9.5px;
      color: #86efac;
      margin-top: 2px;
      font-weight: bold;
    }

    /* Crisp Pixel Art Viewport */
    .canvas-wrap {
      position: relative;
      width: 100%;
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #040308;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #261b42;
    }

    canvas#gameCanvas {
      width: 100%;
      height: 100%;
      object-fit: contain;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      display: block;
    }

    /* Mobile Thumb Controls Deck */
    .controls-deck {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 6px 4px;
      flex-shrink: 0;
      gap: 8px;
    }

    /* 4-Way Tactile D-Pad */
    .dpad {
      position: relative;
      width: 132px;
      height: 132px;
      flex-shrink: 0;
    }

    .dpad-btn {
      position: absolute;
      width: 44px;
      height: 44px;
      background: linear-gradient(145deg, #322852, #1d1633);
      border: 2px solid #4d3e7a;
      color: #e4dcf7;
      font-size: 16px;
      font-weight: bold;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 4px 0 #0c0816;
      touch-action: none;
    }

    .dpad-btn:active, .dpad-btn.active {
      background: #5c459e;
      transform: translateY(2px);
      box-shadow: 0 1px 0 #0c0816;
    }

    .dpad-up    { top: 0; left: 44px; border-radius: 10px 10px 2px 2px; }
    .dpad-down  { bottom: 0; left: 44px; border-radius: 2px 2px 10px 10px; }
    .dpad-left  { top: 44px; left: 0; border-radius: 10px 2px 2px 10px; }
    .dpad-right { top: 44px; right: 0; border-radius: 2px 10px 10px 2px; }

    .dpad-center {
      position: absolute;
      top: 44px;
      left: 44px;
      width: 44px;
      height: 44px;
      background: #1d1633;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .dpad-center::after {
      content: '';
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #110c21;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.85);
    }

    /* Center Menu Pill */
    .center-pills {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin-top: 26px;
    }

    .pill-btn {
      background: linear-gradient(180deg, #3e3063, #241b3d);
      border: 1px solid #604b96;
      color: #f0ebfa;
      font-family: inherit;
      font-size: 10px;
      font-weight: bold;
      letter-spacing: 1px;
      padding: 8px 13px;
      border-radius: 20px;
      box-shadow: 0 3px 0 #0c0816;
      cursor: pointer;
    }

    .pill-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #0c0816;
    }

    /* A / B Action Buttons */
    .ab-cluster {
      position: relative;
      width: 126px;
      height: 120px;
      flex-shrink: 0;
    }

    .action-btn {
      position: absolute;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.28);
      color: #fff;
      font-family: inherit;
      font-size: 18px;
      font-weight: bold;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 5px 0 rgba(0, 0, 0, 0.65), inset 0 2px 4px rgba(255, 255, 255, 0.25);
      touch-action: none;
    }

    .action-btn span {
      font-size: 8px;
      font-weight: normal;
      opacity: 0.9;
      margin-top: -2px;
    }

    .action-btn:active, .action-btn.active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 rgba(0, 0, 0, 0.65);
    }

    .btn-a { top: 4px; right: 2px; background: radial-gradient(circle at 35% 30%, #b57bff, #7b2cff); }
    .btn-b { bottom: 6px; left: 2px; background: radial-gradient(circle at 35% 30%, #ff6b8b, #d4284e); }

    .hint-footer {
      text-align: center;
      font-size: 9px;
      color: var(--muted);
      opacity: 0.85;
      padding-top: 2px;
    }
  </style>
</head>
<body>

  <div class="console-shell">
    <div class="console-top">
      <div class="led-wrap">
        <div class="led"></div>
        <span>REAPER-32 ADVANCE</span>
      </div>
      <button id="muteBtn" class="top-btn" aria-label="Toggle Sound">SFX: ON</button>
    </div>

    <div class="screen-bezel">
      <div class="hud-bar">
        <div class="hud-left">
          <div id="hudArea" class="hud-area">St. Jude Catholic Church</div>
          <div id="hudQuest" class="hud-quest">ACT I: Talk to Cyrine in the Church</div>
        </div>
        <div class="hud-right">
          <div id="hudRealm" class="realm-badge">HUMAN REALM</div>
          <div id="hudHp" class="hud-hp">HP 130/130</div>
        </div>
      </div>

      <div class="canvas-wrap">
        <canvas id="gameCanvas" width="384" height="256"></canvas>
      </div>
    </div>

    <div class="controls-deck">
      <div class="dpad" aria-label="Directional Pad">
        <button class="dpad-btn dpad-up" data-dir="up" aria-label="Up">▲</button>
        <button class="dpad-btn dpad-down" data-dir="down" aria-label="Down">▼</button>
        <button class="dpad-btn dpad-left" data-dir="left" aria-label="Left">◀</button>
        <button class="dpad-btn dpad-right" data-dir="right" aria-label="Right">▶</button>
        <div class="dpad-center"></div>
      </div>

      <div class="center-pills">
        <button id="btnMenu" class="pill-btn">MENU</button>
      </div>

      <div class="ab-cluster">
        <button id="btnA" class="action-btn btn-a">A<span>ACT</span></button>
        <button id="btnB" class="action-btn btn-b">B<span>RUN</span></button>
      </div>
    </div>

    <div class="hint-footer">
      Touch D-Pad + A/B (Tap Chat to Advance) &bull; Keys: WASD/Arrows, Z/Enter, X, M
    </div>
  </div>

<script>
(() => {
  'use strict';

  /* =========================================================================
     1. 32-BIT WEB AUDIO CHIPTUNE SFX ENGINE
     ========================================================================= */
  const SFX = {
    ctx: null,
    muted: false,
    init() {
      if (!this.ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) this.ctx = new AC();
      }
      if (this.ctx && this.ctx.state === 'suspended') {
        this.ctx.resume().catch(() => {});
      }
    },
    tone(freq, dur = 0.08, type = 'square', vol = 0.055, slide = null) {
      if (this.muted) return;
      this.init();
      if (!this.ctx) return;
      try {
        const o = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        o.type = type;
        o.frequency.setValueAtTime(freq, this.ctx.currentTime);
        if (slide) o.frequency.exponentialRampToValueAtTime(slide, this.ctx.currentTime + dur);
        g.gain.setValueAtTime(vol, this.ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + dur);
        o.connect(g);
        g.connect(this.ctx.destination);
        o.start();
        o.stop(this.ctx.currentTime + dur);
      } catch (e) {}
    },
    blip()       { this.tone(680, 0.045, 'square', 0.035); },
    confirm()    { this.tone(540, 0.06, 'square', 0.045, 920); },
    cancel()     { this.tone(360, 0.07, 'triangle', 0.045, 210); },
    step()       { this.tone(130, 0.025, 'triangle', 0.02); },
    door()       { this.tone(280, 0.08, 'triangle', 0.05, 420); setTimeout(() => this.tone(420, 0.08, 'triangle', 0.04, 240), 70); },
    hit()        { this.tone(175, 0.14, 'sawtooth', 0.085, 52); },
    magic()      { this.tone(440, 0.2, 'sine', 0.065, 1140); },
    heal()       { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => this.tone(f, 0.1, 'triangle', 0.05), i * 70)); },
    realmShift() { this.tone(210, 0.35, 'sawtooth', 0.065, 680); setTimeout(() => this.tone(340, 0.35, 'sine', 0.065, 120), 110); },
    victory()    { [523, 659, 784, 1046, 1318].forEach((f, i) => setTimeout(() => this.tone(f, 0.13, 'square', 0.045), i * 100)); }
  };

  /* =========================================================================
     2. CORE CONSTANTS & CHARACTER VISUAL PROFILES
     ========================================================================= */
  const CW = 384;
  const CH = 256;
  const TILE = 24;

  const CHAR_PROFILES = {
    jacob:   { name: 'JACOB',   role: 'Nephilim Healer',   accent: '#38bdf8', skin: '#f7d5b0', skinSh: '#d9ad82', hair: '#d4a64a', hairHi: '#f3d078', hairStyle: 'messy',   eyes: '#2b82d9', outfit: '#2563eb', outfitSh: '#1d4ed8', trim: '#e2e8f0', pants: '#1e293b' },
    cyrine:  { name: 'CYRINE',  role: 'Demon • Profugo',   accent: '#c4b5fd', skin: '#fce1c6', skinSh: '#ddb592', hair: '#e8edf5', hairHi: '#ffffff', hairStyle: 'long',    eyes: '#7c3aed', outfit: '#27272a', outfitSh: '#18181b', trim: '#a78bfa', pants: '#0f172a' },
    navi:    { name: 'NAVI',    role: 'Everred • Reaper',  accent: '#facc15', skin: '#f5d2ae', skinSh: '#d6a97f', hair: '#52341e', hairHi: '#784e30', hairStyle: 'longboy', eyes: '#0ea5e9', outfit: '#1e3a8a', outfitSh: '#172554', trim: '#facc15', pants: '#0f172a' },
    letonin: { name: 'LETONIN', role: 'Reaper of Time',    accent: '#a855f7', skin: '#f8dbc0', skinSh: '#d6ae8d', hair: '#1e1b3a', hairHi: '#3d3770', hairStyle: 'wavy',    eyes: '#b45309', outfit: '#3b1c6e', outfitSh: '#241047', trim: '#c084fc', pants: '#18181b' },
    illicero:{ name: 'ILLICERO',role: 'Reaper of Time',    accent: '#f43f5e', skin: '#f5cfa8', skinSh: '#d4a57c', hair: '#facc15', hairHi: '#fef08a', hairStyle: 'spiky',   eyes: '#e11d48', outfit: '#7f1d1d', outfitSh: '#450a0a', trim: '#fda4af', pants: '#18181b' },
    sendex:  { name: 'SENDEX',  role: 'Reaper -> Angel',   accent: '#ef4444', skin: '#f3cfb0', skinSh: '#cf9f7a', hair: '#14141c', hairHi: '#333347', hairStyle: 'curly',   eyes: '#ef4444', outfit: '#27272a', outfitSh: '#111116', trim: '#ef4444', pants: '#18181b' },
    emillia: { name: 'EMILLIA', role: 'Siren Princess',    accent: '#f472b6', skin: '#fde0c4', skinSh: '#dfb48e', hair: '#f5d061', hairHi: '#fef08a', hairStyle: 'long',    eyes: '#38bdf8', outfit: '#db2777', outfitSh: '#9d174d', trim: '#fbcfe8', pants: '#18181b' },
    death:   { name: 'DEATH',   role: 'Grim Reaper',       accent: '#a855f7', skin: '#f1d2b6', skinSh: '#c9a07e', hair: '#3b2618', hairHi: '#5e3d28', hairStyle: 'hood',    eyes: '#a855f7', outfit: '#111116', outfitSh: '#050508', trim: '#9333ea', pants: '#09090b', isDeath: true },
    crepsus: { name: 'CREPSUS', role: 'Rogue Advisor',     accent: '#f43f5e', skin: '#e8bfa0', skinSh: '#bf8e6d', hair: '#4a2511', hairHi: '#753d1e', hairStyle: 'spiky',   eyes: '#16a34a', outfit: '#450a0a', outfitSh: '#290505', trim: '#f43f5e', pants: '#1c1917', isBoss: true },
    envy:    { name: 'ENVY',    role: 'Divine Sin • Cobra',accent: '#22c55e', skin: '#dcfce7', skinSh: '#86efac', hair: '#14532d', hairHi: '#22c55e', hairStyle: 'long',    eyes: '#16a34a', outfit: '#166534', outfitSh: '#14532d', trim: '#4ade80', pants: '#052e16', isBoss: true },
    mom:     { name: 'DR. MENOS',role: 'Jacob\'s Mom',     accent: '#34d399', skin: '#f5d2ae', skinSh: '#d4a67d', hair: '#92400e', hairHi: '#b45309', hairStyle: 'long',    eyes: '#0ea5e9', outfit: '#f8fafc', outfitSh: '#cbd5e1', trim: '#34d399', pants: '#1e293b' },
    clerk:   { name: 'CLERK',   role: 'Barnes & Noble',    accent: '#fbbf24', skin: '#e8be9e', skinSh: '#c49674', hair: '#451a03', hairHi: '#78350f', hairStyle: 'messy',   eyes: '#1e293b', outfit: '#166534', outfitSh: '#14532d', trim: '#facc15', pants: '#1e293b' },
    crista:  { name: 'CRISTA',  role: 'Mysterious Cat',    accent: '#e2e8f0', isCat: true },
    narrator:{ name: 'CHRONICLE',role: 'Reaperian Texts',  accent: '#f7c948', isNarrator: true }
  };

  /* =========================================================================
     3. HIGH-RES 24x32 OVERWORLD SPRITE & 64x64 PORTRAIT GENERATOR
     ========================================================================= */
  const SpriteCache = {};
  const PortraitCache = {};

  function px(c, x, y, w, h, col) {
    c.fillStyle = col;
    c.fillRect(Math.floor(x), Math.floor(y), Math.floor(w), Math.floor(h));
  }

  // Generate anatomically proportioned 24x32 GBA character sprites
  function getOverworldSprite(key, dir, frame, wings = false) {
    const id = `${key}_${dir}_${frame}_${wings ? 1 : 0}`;
    if (SpriteCache[id]) return SpriteCache[id];

    const oc = document.createElement('canvas');
    oc.width = 24;
    oc.height = 32;
    const c = oc.getContext('2d');
    const p = CHAR_PROFILES[key] || CHAR_PROFILES.jacob;

    // Ground shadow
    px(c, 5, 28, 14, 3, 'rgba(0,0,0,0.38)');

    if (p.isCat) {
      // Cute detailed platinum cat (Crista)
      const bob = frame === 1 ? -1 : 0;
      px(c, 5, 19 + bob, 14, 9, '#cbd5e1');
      px(c, 6, 18 + bob, 12, 9, '#f8fafc');
      // Ears
      px(c, 6, 14 + bob, 3, 4, '#f8fafc');
      px(c, 15, 14 + bob, 3, 4, '#f8fafc');
      px(c, 7, 15 + bob, 1, 2, '#fda4af');
      px(c, 16, 15 + bob, 1, 2, '#fda4af');
      // Eyes & Nose
      px(c, 8, 21 + bob, 2, 2, '#38bdf8');
      px(c, 14, 21 + bob, 2, 2, '#38bdf8');
      px(c, 11, 23 + bob, 2, 1, '#f472b6');
      // Tail
      px(c, 18, 17 + bob, 2, 7, '#e2e8f0');
      SpriteCache[id] = oc;
      return oc;
    }

    const stepL = frame === 1 ? -2 : (frame === 2 ? 2 : 0);
    const stepR = -stepL;
    const bob = frame !== 0 ? -1 : 0;
    const out = '#120d1f';

    // Optional Reaper Wings behind torso
    if (wings) {
      const wCol = key === 'crepsus' ? '#7f1d1d' : '#141021';
      const wHi  = key === 'crepsus' ? '#ef4444' : '#31254d';
      px(c, 0, 11 + bob, 6, 10, wCol);
      px(c, 1, 12 + bob, 4, 4, wHi);
      px(c, 18, 11 + bob, 6, 10, wCol);
      px(c, 19, 12 + bob, 4, 4, wHi);
    }

    // Legs & Shoes (y: 23..30)
    px(c, 7, 23 + Math.min(0, stepL), 4, 6, p.pants);
    px(c, 13, 23 + Math.min(0, stepR), 4, 6, p.pants);
    px(c, 6, 28 + Math.min(0, stepL), 5, 2, '#0f0a18');
    px(c, 13, 28 + Math.min(0, stepR), 5, 2, '#0f0a18');

    // Torso / Jacket with outline & 2-tone shading (y: 15..24)
    px(c, 5, 15 + bob, 14, 9, out);
    px(c, 6, 16 + bob, 12, 7, p.outfit);
    px(c, 13, 16 + bob, 5, 7, p.outfitSh);
    // Collar / trim accent
    px(c, 9, 16 + bob, 6, 2, p.trim);
    px(c, 11, 18 + bob, 2, 5, p.trim);

    // Arms
    const armL = frame === 1 ? 1 : (frame === 2 ? -1 : 0);
    px(c, 4, 16 + bob + armL, 2, 6, p.outfit);
    px(c, 4, 21 + bob + armL, 2, 2, p.skin);
    px(c, 18, 16 + bob - armL, 2, 6, p.outfitSh);
    px(c, 18, 21 + bob - armL, 2, 2, p.skinSh);

    // Head with outline & shading (y: 4..16)
    px(c, 5, 4 + bob, 14, 12, out);
    px(c, 6, 5 + bob, 12, 10, p.skin);
    px(c, 15, 6 + bob, 3, 9, p.skinSh);

    // Hair Silhouette
    if (p.hairStyle === 'hood') {
      px(c, 4, 3 + bob, 16, 12, p.outfit);
      px(c, 6, 7 + bob, 12, 8, p.skin);
      px(c, 6, 5 + bob, 12, 3, p.hair);
    } else {
      px(c, 4, 2 + bob, 16, 6, p.hair);
      px(c, 6, 3 + bob, 10, 2, p.hairHi);
      if (p.hairStyle === 'long' || p.hairStyle === 'longboy') {
        px(c, 4, 6 + bob, 3, 12, p.hair);
        px(c, 17, 6 + bob, 3, 12, p.hair);
      } else if (p.hairStyle === 'spiky') {
        px(c, 5, 1 + bob, 3, 3, p.hair);
        px(c, 10, 0 + bob, 4, 3, p.hair);
        px(c, 16, 1 + bob, 3, 3, p.hair);
      } else if (p.hairStyle === 'curly' || p.hairStyle === 'wavy') {
        px(c, 4, 5 + bob, 3, 6, p.hair);
        px(c, 17, 5 + bob, 3, 6, p.hair);
      }
      // Bangs
      px(c, 6, 6 + bob, 4, 2, p.hair);
      px(c, 12, 6 + bob, 5, 2, p.hair);
    }

    // Face Direction (Eyes)
    if (dir === 'down') {
      px(c, 8, 9 + bob, 2, 3, '#fff');
      px(c, 8, 10 + bob, 2, 2, p.eyes);
      px(c, 14, 9 + bob, 2, 3, '#fff');
      px(c, 14, 10 + bob, 2, 2, p.eyes);
    } else if (dir === 'left') {
      px(c, 7, 9 + bob, 2, 3, '#fff');
      px(c, 7, 10 + bob, 2, 2, p.eyes);
    } else if (dir === 'right') {
      px(c, 15, 9 + bob, 2, 3, '#fff');
      px(c, 15, 10 + bob, 2, 2, p.eyes);
    } else if (dir === 'up') {
      // Back of head covered in hair
      px(c, 5, 5 + bob, 14, 10, p.hair);
      px(c, 7, 6 + bob, 8, 2, p.hairHi);
    }

    // Death's Scythe
    if (p.isDeath) {
      px(c, 20, 2 + bob, 2, 26, '#94a3b8');
      px(c, 13, 1 + bob, 9, 3, '#e2e8f0');
      px(c, 12, 3 + bob, 4, 2, '#cbd5e1');
    }

    SpriteCache[id] = oc;
    return oc;
  }

  // Generate detailed 64x64 pixel-art character busts for Dialogue Boxes!
  function getPortrait(key, expr = 'neutral') {
    const id = `${key}_${expr}`;
    if (PortraitCache[id]) return PortraitCache[id];

    const oc = document.createElement('canvas');
    oc.width = 64;
    oc.height = 64;
    const c = oc.getContext('2d');
    const p = CHAR_PROFILES[key] || CHAR_PROFILES.narrator;

    // Stylized Portrait Backdrop
    const bg = c.createLinearGradient(0, 0, 0, 64);
    bg.addColorStop(0, '#1e1538');
    bg.addColorStop(1, '#0d091a');
    c.fillStyle = bg;
    c.fillRect(0, 0, 64, 64);

    // Subtle accent aura behind bust
    c.fillStyle = p.accent + '28';
    c.beginPath();
    c.arc(32, 30, 24, 0, Math.PI * 2);
    c.fill();

    if (p.isNarrator) {
      // Reaperian Emblem (Winged Crescent & Scythes)
      px(c, 10, 28, 16, 8, '#a855f7');
      px(c, 38, 28, 16, 8, '#a855f7');
      c.fillStyle = '#f7c948';
      c.beginPath(); c.arc(32, 30, 11, 0, Math.PI * 2); c.fill();
      c.fillStyle = '#161026';
      c.beginPath(); c.arc(36, 28, 9, 0, Math.PI * 2); c.fill();
      PortraitCache[id] = oc;
      return oc;
    }

    if (p.isCat) {
      // Crista full bust portrait
      px(c, 18, 24, 28, 24, '#f8fafc');
      px(c, 18, 14, 8, 12, '#f8fafc');
      px(c, 38, 14, 8, 12, '#f8fafc');
      px(c, 20, 17, 4, 7, '#fda4af');
      px(c, 40, 17, 4, 7, '#fda4af');
      px(c, 23, 30, 5, 6, '#38bdf8');
      px(c, 36, 30, 5, 6, '#38bdf8');
      px(c, 25, 31, 2, 2, '#ffffff');
      px(c, 38, 31, 2, 2, '#ffffff');
      px(c, 30, 38, 4, 3, '#f472b6');
      px(c, 14, 46, 36, 18, '#e2e8f0');
      PortraitCache[id] = oc;
      return oc;
    }

    // Back hair layer for long hair
    if (p.hairStyle === 'long' || p.hairStyle === 'longboy') {
      px(c, 12, 16, 40, 44, p.hair);
    }

    // Shoulders & Jacket Collar (y: 44..64)
    px(c, 8, 46, 48, 18, '#110c1c');
    px(c, 10, 48, 44, 16, p.outfit);
    px(c, 38, 48, 16, 16, p.outfitSh);
    // Collar V-neck & Trim
    px(c, 22, 46, 20, 10, p.trim);
    px(c, 25, 44, 14, 10, p.skinSh);
    px(c, 27, 44, 10, 8, p.skin);

    // Face Base (Oval-ish pixel head y: 14..45)
    px(c, 17, 14, 30, 30, '#110c1c');
    px(c, 19, 16, 26, 27, p.skin);
    px(c, 21, 42, 22, 3, p.skin);
    px(c, 39, 18, 6, 24, p.skinSh); // side cheek shadow
    // Ears
    px(c, 16, 27, 3, 6, p.skin);
    px(c, 45, 27, 3, 6, p.skinSh);

    // Blush if blushing/happy
    if (expr === 'blush' || expr === 'happy') {
      px(c, 21, 33, 5, 2, '#fda4af');
      px(c, 38, 33, 5, 2, '#fda4af');
    }

    // Eyes (Expressive GBA style)
    const eyeY = 27;
    px(c, 22, eyeY, 6, 6, '#ffffff');
    px(c, 36, eyeY, 6, 6, '#ffffff');
    px(c, 23, eyeY + 1, 4, 5, p.eyes);
    px(c, 37, eyeY + 1, 4, 5, p.eyes);
    px(c, 24, eyeY + 2, 2, 2, '#090611');
    px(c, 38, eyeY + 2, 2, 2, '#090611');
    px(c, 23, eyeY + 1, 1, 1, '#ffffff'); // eye shine
    px(c, 37, eyeY + 1, 1, 1, '#ffffff');

    // Eyebrows based on expression
    const browCol = p.hair;
    if (expr === 'angry' || expr === 'intense') {
      px(c, 21, 23, 4, 2, browCol); px(c, 25, 25, 3, 2, browCol);
      px(c, 39, 23, 4, 2, browCol); px(c, 36, 25, 3, 2, browCol);
    } else if (expr === 'sad') {
      px(c, 21, 25, 4, 2, browCol); px(c, 25, 23, 3, 2, browCol);
      px(c, 39, 25, 4, 2, browCol); px(c, 36, 23, 3, 2, browCol);
    } else {
      px(c, 22, 24, 6, 2, browCol);
      px(c, 36, 24, 6, 2, browCol);
    }

    // Mouth based on expression
    if (expr === 'happy') {
      px(c, 28, 37, 8, 2, '#7f1d1d');
      px(c, 29, 38, 6, 2, '#f43f5e');
    } else if (expr === 'angry' || expr === 'intense') {
      px(c, 27, 37, 10, 3, '#7f1d1d');
      px(c, 28, 38, 8, 1, '#ffffff');
    } else if (expr === 'sad') {
      px(c, 28, 38, 8, 2, '#8c5347');
      px(c, 27, 39, 2, 1, '#8c5347');
      px(c, 35, 39, 2, 1, '#8c5347');
    } else {
      px(c, 29, 38, 6, 2, '#8c5347');
    }

    // Front Hair / Hood
    if (p.hairStyle === 'hood') {
      px(c, 11, 7, 42, 14, p.outfit);
      px(c, 11, 18, 7, 30, p.outfit);
      px(c, 46, 18, 7, 30, p.outfitSh);
      px(c, 18, 14, 28, 7, p.hair);
    } else {
      px(c, 15, 7, 34, 12, p.hair);
      px(c, 20, 10, 20, 4, p.hairHi);
      // Side locks
      px(c, 15, 16, 5, 18, p.hair);
      px(c, 44, 16, 5, 18, p.hair);
      // Bangs
      px(c, 19, 17, 7, 6, p.hair);
      px(c, 28, 17, 8, 5, p.hair);
      px(c, 38, 17, 7, 7, p.hair);
      if (p.hairStyle === 'spiky') {
        px(c, 17, 3, 6, 6, p.hair);
        px(c, 29, 2, 7, 7, p.hair);
        px(c, 41, 4, 6, 6, p.hair);
      }
    }

    // Accent Frame Inner Rim
    c.strokeStyle = p.accent;
    c.lineWidth = 2;
    c.strokeRect(1, 1, 62, 62);

    PortraitCache[id] = oc;
    return oc;
  }

    realm: 'human', // human | dream | purgatorio | bloodmoon
    questId: 0,
    unlockedCodex: ['reapers', 'purgatorio'],
    party: [JSON.parse(JSON.stringify(ROSTER.jacob))],
    player: { x: 6, y: 8, px: 6 * TILE, py: 8 * TILE, dir: 'up', moving: false, stepFrame: 0 },
    npcs: [],
    particles: [],
    fade: { active: false, alpha: 0, dir: 0, onMid: null },
    dialogue: { queue: [], index: 0, charIndex: 0, timer: 0, onComplete: null, choices: null, choiceIdx: 0 },
    battle: null,
    menu: { tab: 0, subIdx: 0, msg: '' },
    epilogueStep: 0,
    tick: 0
  };

  function fadeToMap(toMap, tx, ty, dir = 'down', newRealm = null, afterCb = null) {
    if (state.fade.active) return;
    SFX.door();
    state.fade = {
      active: true,
      alpha: 0,
      dir: 1,
      onMid: () => {
        state.mapId = toMap;
        if (newRealm) state.realm = newRealm;
        state.player.x = tx;
        state.player.y = ty;
        state.player.px = tx * TILE;
        state.player.py = ty * TILE;
        state.player.dir = dir;
        state.player.moving = false;
        refreshNPCs();
        updateHUD();
        if (afterCb) afterCb();
      }
    };
  }

  function addPartyMember(key) {
    if (!state.party.some(m => m.id === key)) {
      state.party.push(JSON.parse(JSON.stringify(ROSTER[key])));
    }
  }

  function healPartyFull() {
    state.party.forEach(m => { m.hp = m.maxHp; m.mp = m.maxMp; });
    updateHUD();
  }

  function unlockCodex(id) {
    if (!state.unlockedCodex.includes(id)) state.unlockedCodex.push(id);
  }

  /* =========================================================================
     8. DYNAMIC NPCs & ANTI-SOFT-LOCK OBJECTIVE BEACON
     ========================================================================= */
  function refreshNPCs() {
    const q = state.questId;
    const m = state.mapId;
    const list = [];

    if (m === 'church') {
      if (q === 0 || q >= 11) {
        list.push({ id: 'cyrine_church', key: 'cyrine', x: 6, y: 4, dir: 'down' });
      }
    } else if (m === 'jacobs_house') {
      if (q <= 7 || q >= 11) {
        list.push({ id: 'navi_kitchen', key: 'navi', x: 10, y: 3, dir: 'left' });
      }
      if (q >= 4 && q <= 7) {
        list.push({ id: 'crista', key: 'crista', x: 7, y: 6, dir: 'down' });
      }
      if (q >= 1 && q <= 7) {
        list.push({ id: 'cyrine_house', key: 'cyrine', x: 4, y: 6, dir: 'right' });
      }
    } else if (m === 'hospital') {
      list.push({ id: 'mom_doctor', key: 'mom', x: 6, y: 2, dir: 'down' });
    } else if (m === 'barnes_noble') {
      list.push({ id: 'bn_clerk', key: 'clerk', x: 10, y: 5, dir: 'left' });
    } else if (m === 'party_house') {
      if (q === 4) {
        list.push({ id: 'sendex_party', key: 'sendex', x: 10, y: 3, dir: 'left' });
        list.push({ id: 'navi_party', key: 'navi', x: 8, y: 4, dir: 'right' });
        list.push({ id: 'illicero_party', key: 'illicero', x: 8, y: 2, dir: 'right' });
      } else {
        list.push({ id: 'party_guest', key: 'clerk', x: 5, y: 5, dir: 'down' });
      }
    } else if (m === 'colorado_springs') {
      if (q === 7) {
        list.push({ id: 'death_town', key: 'death', x: 6, y: 11, dir: 'down' });
      }
      if (q >= 11) {
        list.push({ id: 'letonin_town', key: 'letonin', x: 11, y: 11, dir: 'down' });
        list.push({ id: 'illicero_town', key: 'illicero', x: 16, y: 11, dir: 'down' });
      }
    } else if (m === 'limbach_park') {
      if (q === 6) {
        list.push({ id: 'sendex_park', key: 'sendex', x: 8, y: 4, dir: 'down', wings: true });
      }
    } else if (m === 'dream_realm') {
      if (q === 3) {
        list.push({ id: 'letonin_dream', key: 'letonin', x: 8, y: 4, dir: 'down' });
      } else if (q === 8) {
        list.push({ id: 'emillia_dream', key: 'emillia', x: 8, y: 4, dir: 'down' });
        list.push({ id: 'letonin_trapped', key: 'letonin', x: 7, y: 3, dir: 'down' });
      }
    } else if (m === 'casa_grande') {
      list.push({ id: 'illicero_az', key: 'illicero', x: 6, y: 10, dir: 'right', wings: true });
      if (q >= 9) {
        list.push({ id: 'emillia_az', key: 'emillia', x: 11, y: 10, dir: 'left' });
      }
      if (q === 9) {
        list.push({ id: 'envy_boss', key: 'envy', x: 8, y: 7, dir: 'down' });
      }
      if (q === 10) {
        list.push({ id: 'crepsus_boss', key: 'crepsus', x: 8, y: 2, dir: 'down', wings: true });
      }
    }

    state.npcs = list;
  }

  // Computes exact (x, y) golden beacon on the CURRENT map so player can never be lost!
  function getObjectiveBeacon() {
    const q = state.questId;
    const m = state.mapId;
    if (q >= 11) return null;

    // Helper: if not on target map, guide to exit mat or town door
    const exitToTown = () => {
      if (m === 'church') return { x: 6.5, y: 10 };
      if (m === 'jacobs_house' || m === 'hospital' || m === 'party_house') return { x: 6.5, y: 9 };
      if (m === 'barnes_noble') return { x: 6.5, y: 8 };
      if (m === 'limbach_park') return { x: 8.5, y: 0 };
      return null;
    };

    if (q === 0) return m === 'church' ? { x: 6, y: 4 } : (m === 'colorado_springs' ? { x: 21, y: 3 } : exitToTown());
    if (q === 1) return m === 'jacobs_house' ? { x: 10, y: 3 } : (m === 'colorado_springs' ? { x: 3, y: 3 } : exitToTown());
    if (q === 2) return m === 'jacobs_house' ? { x: 3.5, y: 3.5 } : (m === 'colorado_springs' ? { x: 3, y: 3 } : exitToTown());
    if (q === 3) return m === 'dream_realm' ? { x: 8, y: 4 } : null;
    if (q === 4) return m === 'party_house' ? { x: 10, y: 3 } : (m === 'colorado_springs' ? { x: 23, y: 14 } : exitToTown());
    if (q === 5) return m === 'limbach_park' ? { x: 8.5, y: 6.5 } : (m === 'colorado_springs' ? { x: 10.5, y: 18 } : exitToTown());
    if (q === 6) return m === 'limbach_park' ? { x: 8, y: 4 } : (m === 'colorado_springs' ? { x: 10.5, y: 18 } : exitToTown());
    if (q === 7) return m === 'colorado_springs' ? { x: 6, y: 11 } : exitToTown();
    if (q === 8) return m === 'casa_grande' ? { x: 3.5, y: 11 } : (m === 'dream_realm' ? { x: 8, y: 4 } : null);
    if (q === 9) return m === 'casa_grande' ? { x: 8, y: 7 } : null;
    if (q === 10) return m === 'casa_grande' ? { x: 8, y: 2 } : null;
    return null;
  }

  /* =========================================================================
     9. DIALOGUE ENGINE WITH 64x64 PORTRAITS & TYPEWRITER
     ========================================================================= */
  function startDialogue(lines, onComplete = null) {
    state.mode = 'dialogue';
    state.dialogue = {
      queue: lines,
      index: 0,
      charIndex: 0,
      timer: 0,
      onComplete,
      choices: null,
      choiceIdx: 0
    };
    SFX.confirm();
  }

  function advanceDialogue() {
    const d = state.dialogue;
    const cur = d.queue[d.index];
    if (!cur) return;

    if (d.charIndex < cur.text.length) {
      d.charIndex = cur.text.length;
      if (cur.choices) { d.choices = cur.choices; d.choiceIdx = 0; }
      return;
    }

    if (d.choices) {
      const chosen = d.choices[d.choiceIdx];
      d.choices = null;
      SFX.confirm();
      if (chosen.reply) d.queue.splice(d.index + 1, 0, chosen.reply);
    }

    d.index++;
    d.charIndex = 0;
    SFX.blip();

    if (d.index >= d.queue.length) {
      state.mode = 'explore';
      const cb = d.onComplete;
      d.onComplete = null;
      if (cb) cb();
    }
  }

  /* =========================================================================
     10. INTERACTION HANDLER (DOORS, BEDS, NPCS, BOOKS, RITUAL CIRCLES)
     ========================================================================= */
  function interact() {
    if (state.fade.active) return;
    const p = state.player;
    let tx = p.x, ty = p.y;
    if (p.dir === 'up') ty--;
    if (p.dir === 'down') ty++;
    if (p.dir === 'left') tx--;
    if (p.dir === 'right') tx++;

    const map = MAPS[state.mapId];

    // 1. Check if facing a warp/door
    const warp = (map.warps || []).find(w => w.x === tx && w.y === ty);
    if (warp) {
      if (warp.reqQuest && state.questId < warp.reqQuest) {
        startDialogue([{ speaker: 'narrator', expr: 'neutral', text: 'A dark barrier seals this path for now. Follow your current Quest objective!' }]);
        return;
      }
      fadeToMap(warp.to, warp.tx, warp.ty, warp.dir, warp.to === 'casa_grande' ? 'bloodmoon' : (warp.to === 'colorado_springs' ? 'human' : null));
      return;
    }

    // 2. Check NPCs in front of player
    const npc = state.npcs.find(n => n.x === tx && n.y === ty);
    if (npc) {
      handleNPC(npc);
      return;
    }

    // 3. Check Interactive Tiles in front or underneath
    const front = (map.grid[ty] && map.grid[ty][tx]) || '';
    const under = map.grid[p.y][p.x];

    // Jacob's Couch / Bed inside Jacob's House (NO SOFT-LOCK!)
    if (state.mapId === 'jacobs_house' && (front === 'B' || under === 'B')) {
      if (state.questId === 2) {
        startDialogue([
          { speaker: 'jacob', expr: 'sad', text: 'I\'m completely drained... Ever since the funeral, nothing feels real anymore.' },
          { speaker: 'narrator', expr: 'neutral', text: 'Jacob drifts off on the living room couch. A violent crimson storm gives way to a glowing cherry-blossom lake...' }
        ], () => {
          SFX.realmShift();
          state.questId = 3;
          unlockCodex('dream');
          fadeToMap('dream_realm', 8, 9, 'up', 'dream');
        });
      } else {
        healPartyFull();
        SFX.heal();
        startDialogue([{ speaker: 'narrator', expr: 'neutral', text: 'You rested on Jacob\'s couch. Party HP & MP fully restored!' }]);
      }
      return;
    }

    // Barnes & Noble Bookshelf (Twilight Fireflies Lore)
    if (state.mapId === 'barnes_noble' && front === 'S') {
      startDialogue([
        { speaker: 'narrator', expr: 'neutral', text: '"Twilight Fireflies" — written by Cyrine\'s mother: A tale of a passionate Red Spirit and a kind Yellow Spirit who calmed its flames.' }
      ]);
      return;
    }

    // Limbach Park Summoning Circle (Quest 5)
    if (state.mapId === 'limbach_park' && (front === 'O' || under === 'O')) {
      if (state.questId === 5) {
        startDialogue([
          { speaker: 'letonin', expr: 'intense', text: '(Through the Ring of Night) Stop right there, Jacob! Repeat these Latin words into the ring!' },
          { speaker: 'jacob', expr: 'intense', text: '"A Deo factus est re: confusa aperire portam, quia est nomen ejus Letonin!"' },
          { speaker: 'narrator', expr: 'neutral', text: 'A golden border ripples across Limbach Park! The sky shifts violet — you have entered PURGATORIO!' },
          { speaker: 'letonin', expr: 'happy', text: 'I\'m finally awake in the physical realm! Wait—Sendex is right ahead, and his eyes are blood red!' }
        ], () => {
          SFX.realmShift();
          state.realm = 'purgatorio';
          state.questId = 6;
          addPartyMember('letonin');
          addPartyMember('navi');
          unlockCodex('alter');
          refreshNPCs();
          updateHUD();
        });
      } else {
        startDialogue([{ speaker: 'narrator', expr: 'neutral', text: 'Faint golden runes shimmer on the grass of Limbach Park.' }]);
      }
      return;
    }

    // Casa Grande Dream Gate (Quest 8)
    if (state.mapId === 'casa_grande' && (front === 'O' || under === 'O') && p.y >= 10) {
      if (state.questId === 8) {
        startDialogue([
          { speaker: 'jacob', expr: 'intense', text: 'Crepsus shot Letonin with a cursed bullet! Sendex gave me these sleeping pills—I\'m diving into Letonin\'s dream to save him!' }
        ], () => {
          SFX.realmShift();
          fadeToMap('dream_realm', 8, 9, 'up', 'dream');
        });
      } else {
        startDialogue([{ speaker: 'narrator', expr: 'neutral', text: 'The Dream Gate hums quietly beneath the Blood Moon.' }]);
      }
      return;
    }
  }

  function handleNPC(npc) {
    const q = state.questId;

    if (npc.id === 'cyrine_church') {
      if (q === 0) {
        startDialogue([
          { speaker: 'cyrine', expr: 'sad', text: 'I couldn\'t even say goodbye, Jacob... Detectives said my family was killed by a forked weapon laced with Iris and Belladonna poison.' },
          { speaker: 'cyrine', expr: 'sad', text: 'What if he comes for me next? I should run away to Alaska before I put you and your mom in danger...' },
          { speaker: 'jacob', expr: 'intense', text: 'You\'re not going anywhere alone, Cyrine. Stay at my house with my mom and me!',
            choices: [
              { label: '"I promise I won\'t leave you."', reply: { speaker: 'cyrine', expr: 'sad', text: 'You\'re so naive... but thank you. Let\'s head back—go inside your house and meet my older brother Navi.' } },
              { label: '"We\'ll find whoever did this."', reply: { speaker: 'cyrine', expr: 'intense', text: 'Whoever he is, he isn\'t normal... Go inside your house first and check on Navi.' } }
            ]
          }
        ], () => {
          state.questId = 1;
          refreshNPCs();
          updateHUD();
        });
      } else {
        startDialogue([{ speaker: 'cyrine', expr: 'happy', text: 'It feels peaceful in here now. Thank you for always sticking by me, Jacob.' }]);
      }
      return;
    }

    if (npc.id === 'navi_kitchen') {
      if (q === 1) {
        startDialogue([
          { speaker: 'navi', expr: 'neutral', text: 'Morning, Jacob. I made brunch—quiche, pancakes, hash browns. Cyrine tells me all about you.' },
          { speaker: 'jacob', expr: 'neutral', text: 'That\'s funny... I\'ve known Cyrine forever, and I barely knew she had an older brother.' },
          { speaker: 'navi', expr: 'intense', text: '(Inner thought: My Alter spell can only hold so long...) You look exhausted, Jacob. Go sleep on the couch over there.' }
        ], () => {
          state.questId = 2;
          refreshNPCs();
          updateHUD();
        });
      } else {
        startDialogue([{ speaker: 'navi', expr: 'neutral', text: 'Keep your guard up, Jacob. Follow the golden marker so we stay ahead of our enemies.' }]);
      }
      return;
    }

    if (npc.id === 'cyrine_house') {
      startDialogue([{ speaker: 'cyrine', expr: 'neutral', text: 'Navi\'s cooking is weirdly good... Have you rested on the couch yet, Jacob?' }]);
      return;
    }

    if (npc.id === 'crista') {
      startDialogue([{ speaker: 'crista', expr: 'neutral', text: 'Meow~ (This platinum-furred cat watches over Cyrine with piercing eyes...)' }]);

    if (npc.id === 'mom_doctor') {

        { speaker: 'crepsus', expr: 'angry', text: 'With Messes Luna and Cyrine\'s Deicide Profugo power, I will surpass Lord Death himself!' },
        { speaker: 'jacob', expr: 'intense', text: 'You destroyed Cyrine\'s family and tortured Sendex. This ends right now!' }
      ], () => {
        startBattle({
          name: 'Crepsus',
          title: 'Demon-Hybrid Rogue Advisor',
          spriteKey: 'crepsus',
          hp: 460, maxHp: 460, atk: 34,
          isFinalBoss: true,
          phaseTriggered: false,
          skills: ['Soul-Drain Rake', 'Messes Luna Flare', 'Abyssal Cleave'],
          onWin: () => {
            unlockCodex('deicide');
            startDialogue([
              { speaker: 'cyrine', expr: 'intense', text: '(Deicide Profugo awakened!) For my mom, my dad, my sister—burn in PYRONECROSIS, Crepsus!' },
              { speaker: 'death', expr: 'intense', text: 'You shattered the balance of life and death, Crepsus. I strip away every ounce of your power.' },
              { speaker: 'narrator', expr: 'neutral', text: 'Crepsus and Envy\'s parasite dissolve into ash as the Blood Moon clears into a serene, starlit sky...' },
              { speaker: 'death', expr: 'sad', text: 'Jacob... to give you a normal life, I must erase your memories of Purgatorio.' },
              { speaker: 'letonin', expr: 'blush', text: 'Then I\'ll drink the blood potion, give up my immortality, and transfer to your school... to fall in love with you all over again.' }
            ], () => {
              state.questId = 11;
              state.mode = 'epilogue';
              state.epilogueStep = 0;
              SFX.victory();
              updateHUD();
            });
          }
        });
      });
