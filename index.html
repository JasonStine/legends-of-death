    }

    if (npc.id === 'letonin_town') {
      startDialogue([{ speaker: 'letonin', expr: 'blush', text: 'Hey Jacob! Mind if I borrow a pencil... and maybe go stargazing tonight?' }]);
      return;
    }

    if (npc.id === 'illicero_town') {
      startDialogue([{ speaker: 'illicero', expr: 'happy', text: 'Cyrine and I are doing great! Thanks for saving all of us, Jacob.' }]);
      return;
    }

    if (npc.id === 'party_guest') {
      startDialogue([{ speaker: 'clerk', expr: 'happy', text: 'Wild party, right? That guy in the leather jacket ran out earlier!' }]);
    }
  }

  /* =========================================================================
     11. GBA TURN-BASED BATTLE ENGINE
     ========================================================================= */
  function startBattle(enemy) {
    state.mode = 'battle';
    state.battle = {
      enemy,
      turnIdx: 0,
      phase: 'menu', // menu | skill | anim | enemyTurn | win | lose
      cursor: 0,
      skillCursor: 0,
      atkBuff: 1.0,
      guarding: false,
      log: `${enemy.name} confronts your squad!`,
      flashTimer: 0,
      shakeTimer: 0,
      floatText: null
    };
    SFX.realmShift();
  }

  function battleNextTurn() {
    const b = state.battle;
    if (!b) return;

    if (b.enemy.hp <= 0) {
      b.enemy.hp = 0;
      b.phase = 'win';
      b.log = `VICTORY! ${b.enemy.name} was defeated! Press A.`;
      SFX.victory();
      return;
    }

    // Scripted Final Boss Climax Awakening!
    if (b.enemy.isFinalBoss && !b.enemy.phaseTriggered && b.enemy.hp <= b.enemy.maxHp * 0.55) {
      b.enemy.phaseTriggered = true;
      b.enemy.hp = Math.max(40, b.enemy.hp - 125);
      b.flashTimer = 24;
      b.shakeTimer = 18;
      SFX.magic();
      b.log = 'Sendex ascends as an ANGEL (Moonlight Sonata) & Cyrine unleashes PYRONECROSIS (-125 HP)!';
      b.phase = 'anim';
      setTimeout(() => { if (state.battle) battleNextTurn(); }, 1800);
      return;
    }

    let next = b.turnIdx + 1;
    while (next < state.party.length && state.party[next].hp <= 0) next++;

    if (next < state.party.length) {
      b.turnIdx = next;
      b.phase = 'menu';
      b.cursor = 0;
      b.log = `What will ${state.party[b.turnIdx].name} do?`;
    } else {
      b.phase = 'enemyTurn';
      setTimeout(runEnemyTurn, 650);
    }
  }

  function runEnemyTurn() {
    const b = state.battle;
    if (!b || state.mode !== 'battle') return;

    const alive = state.party.filter(p => p.hp > 0);
    if (!alive.length) {
      b.phase = 'lose';
      b.log = 'Your party fell... Press A to restore and retry!';
      return;
    }

    const target = alive[Math.floor(Math.random() * alive.length)];
    const sk = b.enemy.skills[Math.floor(Math.random() * b.enemy.skills.length)];
    let dmg = Math.max(9, Math.floor((b.enemy.atk + Math.random() * 10) - target.def * 0.5));
    if (b.guarding) dmg = Math.floor(dmg * 0.5);

    target.hp = Math.max(0, target.hp - dmg);
    b.shakeTimer = 12;
    b.log = `${b.enemy.name} used ${sk}! ${target.name} took ${dmg} DMG!`;
    b.floatText = { text: `-${dmg}`, x: 96, y: 120, color: '#f43f5e', timer: 32 };
    SFX.hit();
    updateHUD();

    setTimeout(() => {
      if (!state.battle) return;
      if (state.party.every(p => p.hp <= 0)) {
        b.phase = 'lose';
        b.log = 'Defeated! Press A to retry with full HP.';
        return;
      }
      b.guarding = false;
      b.turnIdx = state.party.findIndex(p => p.hp > 0);
      b.phase = 'menu';
      b.cursor = 0;
      b.log = `What will ${state.party[b.turnIdx].name} do?`;
    }, 1050);
  }

  function handleBattleA() {
    const b = state.battle;
    if (!b) return;

    if (b.phase === 'win') {
      const cb = b.enemy.onWin;
      state.battle = null;
      state.mode = 'explore';
      if (cb) cb();
      return;
    }

    if (b.phase === 'lose') {
      healPartyFull();
      b.enemy.hp = b.enemy.maxHp;
      b.turnIdx = 0;
      b.phase = 'menu';
      b.log = 'Second wind! Fight on!';
      SFX.heal();
      return;
    }

    const actor = state.party[b.turnIdx];
    if (b.phase === 'menu') {
      if (b.cursor === 0) {
        const dmg = Math.floor((actor.atk + Math.random() * 9) * b.atkBuff);
        b.enemy.hp = Math.max(0, b.enemy.hp - dmg);
        b.flashTimer = 14;
        b.log = `${actor.name} strikes! Dealt ${dmg} DMG!`;
        b.floatText = { text: `-${dmg}`, x: 276, y: 66, color: '#f7c948', timer: 32 };
        b.phase = 'anim';
        SFX.hit();
        setTimeout(battleNextTurn, 800);
      } else if (b.cursor === 1) {
        b.phase = 'skill';
        b.skillCursor = 0;
        SFX.blip();
      } else if (b.cursor === 2) {
        if (actor.mp >= 10) {
          actor.mp -= 10;
          state.party.forEach(p => { if (p.hp > 0) p.hp = Math.min(p.maxHp, p.hp + 48); });
          b.log = `${actor.name} channels Soul Fusion! Party healed +48 HP!`;
          b.floatText = { text: '+48 HP', x: 96, y: 120, color: '#4ade80', timer: 32 };
          b.phase = 'anim';
          SFX.heal();
          updateHUD();
          setTimeout(battleNextTurn, 850);
        } else {
          b.log = 'Not enough MP (needs 10 MP)!';
          SFX.cancel();
        }
      } else if (b.cursor === 3) {
        b.guarding = true;
        actor.mp = Math.min(actor.maxMp, actor.mp + 15);
        b.log = `${actor.name} defends & recovers +15 MP!`;
        b.phase = 'anim';
        SFX.blip();
        setTimeout(battleNextTurn, 700);
      }
      return;
    }

    if (b.phase === 'skill') {
      const sk = actor.skills[b.skillCursor];
      if (!sk) return;
      if (actor.mp < sk.cost) {
        b.log = `Not enough MP for ${sk.name}!`;
        SFX.cancel();
        return;
      }
      actor.mp -= sk.cost;
      b.phase = 'anim';
      if (sk.type === 'dmg') {
        const dmg = Math.floor((sk.power + Math.random() * 10) * b.atkBuff);
        b.enemy.hp = Math.max(0, b.enemy.hp - dmg);
        b.flashTimer = 18;
        b.shakeTimer = 10;
        b.log = `${actor.name} unleashes ${sk.name}! ${dmg} DMG!`;
        b.floatText = { text: `-${dmg}`, x: 276, y: 66, color: '#c084fc', timer: 32 };
        SFX.magic();
      } else if (sk.type === 'healAll') {
        state.party.forEach(p => { if (p.hp > 0) p.hp = Math.min(p.maxHp, p.hp + sk.power); });
        b.log = `${actor.name} casts ${sk.name}! Party restored!`;
        b.floatText = { text: `+${sk.power}`, x: 96, y: 120, color: '#4ade80', timer: 32 };
        SFX.heal();
      } else if (sk.type === 'buff') {
        b.atkBuff = sk.power;
        b.log = `${actor.name} uses ${sk.name}! Party ATK surged!`;
        SFX.magic();
      }
      updateHUD();
      setTimeout(battleNextTurn, 900);
    }
  }

  /* =========================================================================
     12. SAVE / LOAD / NEW GAME
     ========================================================================= */
  const SAVE_KEY = 'lod_32bit_gba_v2';

  function saveGame() {
    try {
      localStorage.setItem(SAVE_KEY, JSON.stringify({
        mapId: state.mapId,
        realm: state.realm,
        questId: state.questId,
        unlockedCodex: state.unlockedCodex,
        party: state.party,
        player: { x: state.player.x, y: state.player.y, dir: state.player.dir }
      }));
      state.menu.msg = 'Saved to your device!';
      SFX.heal();
    } catch (e) {
      state.menu.msg = 'Save unavailable in private mode.';
    }
  }

  function loadGame() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) { state.menu.msg = 'No save data found.'; SFX.cancel(); return; }
      const d = JSON.parse(raw);
      state.mapId = d.mapId || 'church';
      state.realm = d.realm || 'human';
      state.questId = d.questId || 0;
      state.unlockedCodex = d.unlockedCodex || ['reapers', 'purgatorio'];
      state.party = d.party || [JSON.parse(JSON.stringify(ROSTER.jacob))];
      state.player.x = d.player.x;
      state.player.y = d.player.y;
      state.player.px = d.player.x * TILE;
      state.player.py = d.player.y * TILE;
      state.player.dir = d.player.dir || 'down';
      state.player.moving = false;
      refreshNPCs();
      updateHUD();
      state.mode = 'explore';
      SFX.confirm();
    } catch (e) {
      state.menu.msg = 'Could not load save.';
    }
  }

  function startNewGame() {
    state.mapId = 'church';
    state.realm = 'human';
    state.questId = 0;
    state.unlockedCodex = ['reapers', 'purgatorio'];
    state.party = [JSON.parse(JSON.stringify(ROSTER.jacob))];
    state.player = { x: 6, y: 8, px: 6 * TILE, py: 8 * TILE, dir: 'up', moving: false, stepFrame: 0 };
    refreshNPCs();
    updateHUD();
    state.mode = 'explore';
    startDialogue([
      { speaker: 'narrator', expr: 'neutral', text: 'April 23rd — St. Jude Catholic Church, Colorado Springs. Days after the "Corpse Circus" tragedy...' },
      { speaker: 'jacob', expr: 'sad', text: 'Cyrine is sitting in the front pew ahead. I need to talk to her.' }
    ]);
  }

  /* =========================================================================
     13. INPUT HANDLING (TOUCH D-PAD + CANVAS TAP + KEYBOARD)
     ========================================================================= */
  const held = { up: false, down: false, left: false, right: false, run: false };

  function pressA() {
    SFX.init();
    if (state.fade.active) return;
    if (state.mode === 'title') startNewGame();
    else if (state.mode === 'explore') interact();
    else if (state.mode === 'dialogue') advanceDialogue();
    else if (state.mode === 'battle') handleBattleA();
    else if (state.mode === 'menu') {
      if (state.menu.tab === 3) {
        if (state.menu.subIdx === 0) saveGame();
        else if (state.menu.subIdx === 1) loadGame();
        else if (state.menu.subIdx === 2) startNewGame();
      } else SFX.blip();
    } else if (state.mode === 'epilogue') {
      state.epilogueStep++;
      SFX.confirm();
      if (state.epilogueStep >= 3) {
        fadeToMap('colorado_springs', 11, 13, 'up', 'human', () => { state.mode = 'explore'; });
      }
    }
  }

  function pressB() {
    SFX.init();
    if (state.mode === 'dialogue') advanceDialogue();
    else if (state.mode === 'battle' && state.battle && state.battle.phase === 'skill') {
      state.battle.phase = 'menu';
      SFX.cancel();
    } else if (state.mode === 'menu') {
      state.mode = 'explore';
      SFX.cancel();
    } else if (state.mode === 'epilogue') {
      startNewGame();
    }
  }

  function pressMenu() {
    SFX.init();
    if (state.mode === 'explore') { state.mode = 'menu'; state.menu.msg = ''; SFX.confirm(); }
    else if (state.mode === 'menu') { state.mode = 'explore'; SFX.cancel(); }
  }

  function menuDir(dir) {
    if (state.mode === 'dialogue' && state.dialogue.choices) {
      if (dir === 'up' || dir === 'down') {
        state.dialogue.choiceIdx = (state.dialogue.choiceIdx + 1) % state.dialogue.choices.length;
        SFX.blip();
      }
      return;
    }
    if (state.mode === 'battle' && state.battle) {
      const b = state.battle;
      if (b.phase === 'menu') {
        if (dir === 'left' || dir === 'right') b.cursor ^= 1;
        if (dir === 'up' || dir === 'down') b.cursor ^= 2;
        SFX.blip();
      } else if (b.phase === 'skill') {
        const len = state.party[b.turnIdx].skills.length;
        if (dir === 'up') b.skillCursor = (b.skillCursor - 1 + len) % len;
        if (dir === 'down') b.skillCursor = (b.skillCursor + 1) % len;
        SFX.blip();
      }
      return;
    }
    if (state.mode === 'menu') {
      if (dir === 'left')  { state.menu.tab = (state.menu.tab + 3) % 4; state.menu.subIdx = 0; state.menu.msg = ''; SFX.blip(); }
      if (dir === 'right') { state.menu.tab = (state.menu.tab + 1) % 4; state.menu.subIdx = 0; state.menu.msg = ''; SFX.blip(); }
      if (dir === 'up')    { state.menu.subIdx = Math.max(0, state.menu.subIdx - 1); SFX.blip(); }
      if (dir === 'down')  {
        const max = state.menu.tab === 2 ? state.unlockedCodex.length - 1 : 2;
        state.menu.subIdx = Math.min(Math.max(0, max), state.menu.subIdx + 1);
        SFX.blip();
      }
    }
  }

  document.querySelectorAll('.dpad-btn').forEach(btn => {
    const dir = btn.dataset.dir;
    const down = (e) => { e.preventDefault(); SFX.init(); btn.classList.add('active'); held[dir] = true; menuDir(dir); };
    const up   = (e) => { e.preventDefault(); btn.classList.remove('active'); held[dir] = false; };
    btn.addEventListener('pointerdown', down);
    btn.addEventListener('pointerup', up);
    btn.addEventListener('pointerleave', up);
    btn.addEventListener('pointercancel', up);
  });

  document.getElementById('btnA').addEventListener('pointerdown', (e) => { e.preventDefault(); pressA(); });
  const btnB = document.getElementById('btnB');
  btnB.addEventListener('pointerdown', (e) => { e.preventDefault(); held.run = true; pressB(); });
  btnB.addEventListener('pointerup', () => { held.run = false; });
  btnB.addEventListener('pointerleave', () => { held.run = false; });
  document.getElementById('btnMenu').addEventListener('pointerdown', (e) => { e.preventDefault(); pressMenu(); });

  // Tap directly on canvas to advance dialogue or start from title
  const canvas = document.getElementById('gameCanvas');
  canvas.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    if (state.mode === 'dialogue' || state.mode === 'title' || state.mode === 'epilogue') pressA();
  });

  const muteBtn = document.getElementById('muteBtn');
  muteBtn.addEventListener('click', () => {
    SFX.muted = !SFX.muted;
    muteBtn.textContent = SFX.muted ? 'SFX: OFF' : 'SFX: ON';
  });

  window.addEventListener('keydown', (e) => {
    const k = e.key.toLowerCase();
    if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].includes(k)) e.preventDefault();
    if (k === 'arrowup' || k === 'w')    { held.up = true; menuDir('up'); }
    if (k === 'arrowdown' || k === 's')  { held.down = true; menuDir('down'); }
    if (k === 'arrowleft' || k === 'a')  { held.left = true; menuDir('left'); }
    if (k === 'arrowright' || k === 'd') { held.right = true; menuDir('right'); }
    if (k === 'z' || k === 'enter' || k === ' ') pressA();
    if (k === 'x' || k === 'shift')      { held.run = true; pressB(); }
    if (k === 'm' || k === 'escape')     { e.preventDefault(); pressMenu(); }
  });

  window.addEventListener('keyup', (e) => {
    const k = e.key.toLowerCase();
    if (k === 'arrowup' || k === 'w')    held.up = false;
    if (k === 'arrowdown' || k === 's')  held.down = false;
    if (k === 'arrowleft' || k === 'a')  held.left = false;
    if (k === 'arrowright' || k === 'd') held.right = false;
    if (k === 'x' || k === 'shift')      held.run = false;
  });

  /* =========================================================================
     14. UPDATE LOOP (MOVEMENT, AUTOMATIC DOOR WARPS, FADES)
     ========================================================================= */
  function isSolid(x, y) {
    const map = MAPS[state.mapId];
    if (y < 0 || y >= map.grid.length || x < 0 || x >= map.grid[0].length) return true;
    const ch = map.grid[y][x];
    if (['#', 'W', 'R', '~', 'C', 'P', 'S', 'B'].includes(ch)) return true;
    if (state.npcs.some(n => n.x === x && n.y === y)) return true;
    return false;
  }

  function checkStepWarp(x, y) {
    const map = MAPS[state.mapId];
    const warp = (map.warps || []).find(w => w.x === x && w.y === y);
    if (!warp) return;
    if (warp.reqQuest && state.questId < warp.reqQuest) {
      startDialogue([{ speaker: 'narrator', expr: 'neutral', text: 'A supernatural barrier blocks this exit for now. Follow your current Quest!' }]);
      return;
    }
    fadeToMap(warp.to, warp.tx, warp.ty, warp.dir, warp.to === 'casa_grande' ? 'bloodmoon' : (warp.to === 'colorado_springs' ? 'human' : null));
  }

  function update() {
    state.tick++;

    // Handle Fade Transitions
    if (state.fade.active) {
      state.fade.alpha += state.fade.dir * 0.09;
      if (state.fade.dir === 1 && state.fade.alpha >= 1) {
        state.fade.alpha = 1;
        state.fade.dir = -1;
        if (state.fade.onMid) { state.fade.onMid(); state.fade.onMid = null; }
      } else if (state.fade.dir === -1 && state.fade.alpha <= 0) {
        state.fade.alpha = 0;
        state.fade.active = false;
      }
      return;
    }

    // Ambient particles
    if (state.tick % 10 === 0 && state.particles.length < 24) {
      state.particles.push({ x: Math.random() * CW, y: Math.random() * CH, vy: -0.3 - Math.random() * 0.35, life: 90 });
    }
    state.particles.forEach(pt => { pt.y += pt.vy; pt.life--; });
    state.particles = state.particles.filter(pt => pt.life > 0);

    if (state.mode === 'dialogue') {
      const d = state.dialogue;
      const cur = d.queue[d.index];
      if (cur && d.charIndex < cur.text.length) {
        d.timer++;
        if (d.timer % 2 === 0) {
          d.charIndex++;
          if (d.charIndex === cur.text.length && cur.choices) { d.choices = cur.choices; d.choiceIdx = 0; }
        }
      }
      return;
    }

    if (state.mode === 'battle' && state.battle) {
      if (state.battle.flashTimer > 0) state.battle.flashTimer--;
      if (state.battle.shakeTimer > 0) state.battle.shakeTimer--;
      if (state.battle.floatText) {
        state.battle.floatText.y -= 0.7;
        state.battle.floatText.timer--;
        if (state.battle.floatText.timer <= 0) state.battle.floatText = null;
      }
      return;
    }

    if (state.mode !== 'explore') return;

    const p = state.player;
    const speed = held.run ? 4 : 3;

    if (p.moving) {
      const tx = p.x * TILE, ty = p.y * TILE;
      if (p.px < tx) p.px = Math.min(tx, p.px + speed);
      if (p.px > tx) p.px = Math.max(tx, p.px - speed);
      if (p.py < ty) p.py = Math.min(ty, p.py + speed);
      if (p.py > ty) p.py = Math.max(ty, p.py - speed);
      p.stepFrame++;
      if (p.px === tx && p.py === ty) {
        p.moving = false;
        checkStepWarp(p.x, p.y);
      }
    } else {
      let dx = 0, dy = 0, nd = null;
      if (held.up)    { dy = -1; nd = 'up'; }
      else if (held.down)  { dy = 1; nd = 'down'; }
      else if (held.left)  { dx = -1; nd = 'left'; }
      else if (held.right) { dx = 1; nd = 'right'; }

      if (nd) {
        p.dir = nd;
        const nx = p.x + dx, ny = p.y + dy;
        if (!isSolid(nx, ny)) {
          p.x = nx;
          p.y = ny;
          p.moving = true;
          if (state.tick % 4 === 0) SFX.step();
        }
      }
    }
  }

  /* =========================================================================
     15. 32-BIT GBA RENDERER (384x256)
     ========================================================================= */
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;

  function drawTile(ch, sx, sy, theme, gx, gy) {
    // Base floor by theme
    const themes = {
      town:      { f1: '#3b8c52', f2: '#337d48', path: '#d6c69c', wall: '#d8dee9', roof: '#8c2332', tree: '#1d5e32' },
      park:      { f1: '#327d49', f2: '#2b6e3f', path: '#cbb88d', wall: '#cbd5e1', roof: '#7f1d1d', tree: '#144d27' },
      wood:      { f1: '#8c6239', f2: '#7a542f', path: '#7c2d12', wall: '#3f2e21', roof: '#2b1d12', tree: '#2b1d12' },
      church:    { f1: '#475569', f2: '#3e4b5e', path: '#991b1b', wall: '#1e293b', roof: '#0f172a', tree: '#1e293b' },
      hospital:  { f1: '#e2e8f0', f2: '#cbd5e1', path: '#93c5fd', wall: '#475569', roof: '#334155', tree: '#334155' },
      party:     { f1: '#23163b', f2: '#1b112e', path: '#4c1d95', wall: '#140c24', roof: '#0d0717', tree: '#140c24' },
      dream:     { f1: '#1e293b', f2: '#172033', path: '#94a3b8', wall: '#0f172a', roof: '#4c1d95', tree: '#f472b6' },
      bloodmoon: { f1: '#5c281c', f2: '#4d2016', path: '#8f4f38', wall: '#2b1016', roof: '#450a0a', tree: '#2e0d15' }
    };
    const T = themes[theme] || themes.town;

    // Ground
    px(ctx, sx, sy, TILE, TILE, (gx + gy) % 2 === 0 ? T.f1 : T.f2);
    if (theme === 'town' || theme === 'park') {
      px(ctx, sx + 4, sy + 6, 2, 2, 'rgba(255,255,255,0.12)');
      px(ctx, sx + 16, sy + 17, 2, 2, 'rgba(0,0,0,0.1)');
    } else if (theme === 'wood') {
      px(ctx, sx, sy + 11, TILE, 1, 'rgba(0,0,0,0.2)');
      px(ctx, sx, sy + 23, TILE, 1, 'rgba(0,0,0,0.2)');
    } else if (theme === 'party' && ch === ',') {
      const col = ['#a855f7', '#ec4899', '#38bdf8'][(gx + gy + (state.tick >> 4)) % 3];
      px(ctx, sx + 2, sy + 2, TILE - 4, TILE - 4, col + '55');
    }

    if (ch === ',' || ch === 'v' || ch === '^' || ch === '>') {
      px(ctx, sx, sy, TILE, TILE, T.path);
      px(ctx, sx + 3, sy + 3, 3, 2, 'rgba(0,0,0,0.08)');
      px(ctx, sx + 15, sy + 16, 3, 2, 'rgba(0,0,0,0.08)');
    } else if (ch === '#') {
      if (theme === 'town' || theme === 'park') {
        // Lush GBA Tree
        px(ctx, sx + 9, sy + 15, 6, 9, '#5c3a21');
        px(ctx, sx + 2, sy + 3, 20, 14, '#113d1f');
        px(ctx, sx + 4, sy + 2, 16, 13, T.tree);
        px(ctx, sx + 6, sy + 4, 8, 5, '#4ade8044');
      } else {
        // Interior / Fortress Wall
        px(ctx, sx, sy, TILE, TILE, T.wall);
        px(ctx, sx, sy + 20, TILE, 4, 'rgba(0,0,0,0.35)');
      }
    } else if (ch === 'R') {
      // Shingled Building Roof
      px(ctx, sx, sy, TILE, TILE, T.roof);
      px(ctx, sx, sy + 6, TILE, 2, 'rgba(255,255,255,0.16)');
      px(ctx, sx, sy + 15, TILE, 2, 'rgba(0,0,0,0.25)');
    } else if (ch === 'W') {
      // Siding Wall with Window
      px(ctx, sx, sy, TILE, TILE, T.wall);
      px(ctx, sx + 5, sy + 5, 14, 12, '#334155');
      px(ctx, sx + 7, sy + 7, 10, 8, '#38bdf8');
      px(ctx, sx + 11, sy + 7, 2, 8, '#334155');
    } else if (ch === 'D') {
      // Enterable Doorway
      px(ctx, sx, sy, TILE, TILE, T.wall);
      px(ctx, sx + 4, sy + 2, 16, 22, '#291509');
      px(ctx, sx + 6, sy + 4, 12, 20, '#5c3419');
      px(ctx, sx + 14, sy + 14, 3, 3, '#f7c948');
    } else if (ch === 'E') {
      // Interior Red/Gold Exit Doormat
      px(ctx, sx + 2, sy + 4, 20, 16, '#991b1b');
      px(ctx, sx + 4, sy + 6, 16, 12, '#dc2626');
      ctx.strokeStyle = '#f7c948';
      ctx.strokeRect(sx + 4.5, sy + 6.5, 15, 11);
    } else if (ch === 'B') {
      // Bed / Living Room Couch
      px(ctx, sx + 2, sy + 2, 20, 20, '#1e3a8a');
      px(ctx, sx + 4, sy + 4, 16, 16, '#3b82f6');
      px(ctx, sx + 5, sy + 4, 14, 6, '#f8fafc');
    } else if (ch === 'C') {
      // Kitchen Counter / Reception Desk
      px(ctx, sx, sy + 2, TILE, 20, '#64748b');
      px(ctx, sx + 2, sy + 4, TILE - 4, 14, '#cbd5e1');
    } else if (ch === 'P') {
      // Wooden Pew / Table
      px(ctx, sx + 2, sy + 5, 20, 14, '#451a03');
      px(ctx, sx + 4, sy + 7, 16, 8, '#78350f');
    } else if (ch === 'S') {
      // Stained Glass / Bookshelf
      if (theme === 'church') {
        px(ctx, sx + 2, sy + 2, 20, 20, '#1e1b4b');
        px(ctx, sx + 4, sy + 4, 7, 16, '#38bdf8');
        px(ctx, sx + 13, sy + 4, 7, 16, '#f43f5e');
        px(ctx, sx + 8, sy + 8, 8, 8, '#facc15');
      } else {
        px(ctx, sx + 1, sy + 1, 22, 22, '#451a03');
        px(ctx, sx + 3, sy + 4, 18, 5, '#ef4444');
        px(ctx, sx + 3, sy + 12, 18, 5, '#3b82f6');
      }
    } else if (ch === '~') {
      // Animated Water / Starry Dream Lake
      px(ctx, sx, sy, TILE, TILE, theme === 'dream' ? '#0f172a' : '#2563eb');
      if (theme === 'dream' && ((gx * 7 + gy * 13 + (state.tick >> 4)) % 9 === 0)) {
        px(ctx, sx + 10, sy + 10, 3, 3, '#fef08a');
      } else {
        const w = (state.tick >> 4) % 6;
        px(ctx, sx + 4 + w, sy + 8, 8, 2, 'rgba(255,255,255,0.22)');
      }
    } else if (ch === 'O') {
      // Glowing Ritual Circle / Altar
      const a = 0.38 + 0.35 * Math.sin(state.tick * 0.1);
      px(ctx, sx + 2, sy + 2, 20, 20, theme === 'bloodmoon' ? `rgba(244,63,94,${a})` : `rgba(168,85,247,${a})`);
      ctx.strokeStyle = '#f7c948';
      ctx.strokeRect(sx + 3.5, sy + 3.5, 17, 17);
    } else if (ch === 'F') {
      // Flowers / Cherry Blossoms
      px(ctx, sx + 5, sy + 6, 4, 4, theme === 'dream' ? '#f9a8d4' : '#facc15');
      px(ctx, sx + 14, sy + 14, 4, 4, theme === 'bloodmoon' ? '#f43f5e' : '#f472b6');
    }
  }

  function renderExplore() {
    const map = MAPS[state.mapId];
    const mw = map.grid[0].length * TILE;
    const mh = map.grid.length * TILE;
    const p = state.player;

    let camX = p.px - CW / 2 + TILE / 2;
    let camY = p.py - CH / 2 + TILE / 2;
    camX = mw <= CW ? -(CW - mw) / 2 : Math.max(0, Math.min(mw - CW, camX));
    camY = mh <= CH ? -(CH - mh) / 2 : Math.max(0, Math.min(mh - CH, camY));

    // Fill letterbox background for smaller interiors
    px(ctx, 0, 0, CW, CH, '#080510');

    // Draw Tiles
    for (let y = 0; y < map.grid.length; y++) {
      for (let x = 0; x < map.grid[0].length; x++) {
        const sx = Math.floor(x * TILE - camX);
        const sy = Math.floor(y * TILE - camY);
        if (sx < -TILE || sy < -TILE || sx > CW || sy > CH) continue;
        drawTile(map.grid[y][x], sx, sy, map.theme, x, y);
      }
    }

    // Landmark Signs
    ctx.font = 'bold 8px monospace';
    ctx.textAlign = 'center';
    (map.labels || []).forEach(lb => {
      const lx = Math.floor(lb.x * TILE - camX);
      const ly = Math.floor(lb.y * TILE - camY);
      const w = ctx.measureText(lb.text).width + 8;
      px(ctx, lx - w / 2, ly - 8, w, 11, 'rgba(9,6,17,0.78)');
      ctx.fillStyle = '#f7c948';
      ctx.fillText(lb.text, lx, ly);
    });
    ctx.textAlign = 'left';

    // Y-Sorted Entities (Player + NPCs) for proper GBA depth
    const entities = state.npcs.map(n => ({
      y: n.y * TILE,
      draw: () => {
        const sp = getOverworldSprite(n.key, n.dir, 0, !!n.wings);
        ctx.drawImage(sp, Math.floor(n.x * TILE - camX), Math.floor(n.y * TILE - camY - 10));
      }
    }));

    const walkIdx = p.moving ? (Math.floor(p.stepFrame / 6) % 2 === 0 ? 1 : 2) : 0;
    entities.push({
      y: p.py,
      draw: () => {
        const sp = getOverworldSprite('jacob', p.dir, walkIdx, false);
        ctx.drawImage(sp, Math.floor(p.px - camX), Math.floor(p.py - camY - 10));
      }
    });

    entities.sort((a, b) => a.y - b.y);
    entities.forEach(e => e.draw());

    // Pulsing Golden Quest Beacon
    const beacon = getObjectiveBeacon();
    if (beacon) {
      const bx = Math.floor(beacon.x * TILE - camX + 12);
      const by = Math.floor(beacon.y * TILE - camY - 14 + Math.sin(state.tick * 0.14) * 3);
      ctx.fillStyle = '#f7c948';
      ctx.beginPath();
      ctx.moveTo(bx, by + 9);
      ctx.lineTo(bx - 6, by);
      ctx.lineTo(bx + 6, by);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = '#090611';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }

    // Realm Lighting Tint + Floating Particles
    if (state.realm === 'purgatorio') px(ctx, 0, 0, CW, CH, 'rgba(88, 28, 135, 0.25)');
    else if (state.realm === 'bloodmoon') px(ctx, 0, 0, CW, CH, 'rgba(153, 27, 27, 0.24)');

    if (state.realm !== 'human') {
      state.particles.forEach(pt => {
        px(ctx, pt.x, pt.y, 2, 2, state.realm === 'bloodmoon' ? '#fda4af' : '#e9d5ff');
      });
    }
  }

  function renderDialogue() {
    const d = state.dialogue;
    const cur = d.queue[d.index];
    if (!cur) return;

    const prof = CHAR_PROFILES[cur.speaker] || CHAR_PROFILES.narrator;
    const port = getPortrait(cur.speaker, cur.expr || 'neutral');

    // Bottom GBA Dialogue Frame (y: 162..252)
    px(ctx, 6, 162, CW - 12, 88, '#0e091c');
    ctx.strokeStyle = prof.accent || '#9b5cff';
    ctx.lineWidth = 2;
    ctx.strokeRect(7, 163, CW - 14, 86);
    ctx.strokeStyle = '#e2e8f0';
    ctx.lineWidth = 1;
    ctx.strokeRect(10, 166, CW - 20, 80);

    // 64x64 Character Bust Portrait scaled cleanly to 74x74px!
    ctx.drawImage(port, 14, 169, 74, 74);

    // Character Name & Role Tag
    px(ctx, 94, 169, 274, 15, '#1b1333');
    ctx.fillStyle = prof.accent || '#f7c948';
    ctx.font = 'bold 10px monospace';
    ctx.fillText(prof.name, 98, 180);
    ctx.fillStyle = '#a699c2';
    ctx.font = '8.5px monospace';
    ctx.fillText('• ' + prof.role, 168, 180);

    // Wrapped Typewriter Text
    ctx.fillStyle = '#f8fafc';
    ctx.font = '10px monospace';
    wrapText(cur.text.slice(0, d.charIndex), 96, 198, 272, 13);

    // Choices Box
    if (d.choices) {
      px(ctx, 134, 108, 240, 48, '#140e29');
      ctx.strokeStyle = '#f7c948';
      ctx.lineWidth = 1.5;
      ctx.strokeRect(134.5, 108.5, 239, 47);
      d.choices.forEach((ch, idx) => {
        ctx.fillStyle = idx === d.choiceIdx ? '#f7c948' : '#cbd5e1';
        ctx.font = 'bold 9.5px monospace';
        ctx.fillText((idx === d.choiceIdx ? '▶ ' : '  ') + ch.label, 142, 126 + idx * 18);
      });
    } else if (d.charIndex >= cur.text.length && (state.tick % 30 < 15)) {
      ctx.fillStyle = '#f7c948';
      ctx.font = 'bold 10px monospace';
      ctx.fillText('▼', CW - 24, 240);
    }
  }

  function wrapText(text, x, y, maxW, lineH) {
    const words = text.split(' ');
    let line = '', cy = y;
    for (let i = 0; i < words.length; i++) {
      const test = line + words[i] + ' ';
      if (ctx.measureText(test).width > maxW && i > 0) {
        ctx.fillText(line, x, cy);
        line = words[i] + ' ';
        cy += lineH;
      } else line = test;
    }
    ctx.fillText(line, x, cy);
  }

  function renderBattle() {
    const b = state.battle;
    if (!b) return;
    const shakeX = b.shakeTimer > 0 ? (Math.random() * 6 - 3) : 0;

    ctx.save();
    ctx.translate(shakeX, 0);

    // Battle Sky & Arena
    const g = ctx.createLinearGradient(0, 0, 0, 174);
    g.addColorStop(0, state.realm === 'bloodmoon' ? '#3d0715' : '#1b0f38');
    g.addColorStop(1, '#0a0714');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, CW, 174);

    // Enemy Platform & High-Res Bust/Sprite
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    ctx.beginPath();
    ctx.ellipse(286, 102, 54, 15, 0, 0, Math.PI * 2);
    ctx.fill();

    if (b.flashTimer % 4 < 2) {
      const ep = getPortrait(b.enemy.spriteKey, 'angry');
      ctx.drawImage(ep, 254, 34, 64, 64);
    }

    // Enemy Status Box
    px(ctx, 12, 12, 186, 44, '#140e29');
    ctx.strokeStyle = '#f43f5e';
    ctx.strokeRect(12.5, 12.5, 185, 43);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 10px monospace';
    ctx.fillText(b.enemy.name, 18, 25);
    ctx.fillStyle = '#cbd5e1';
    ctx.font = '8px monospace';
    ctx.fillText(b.enemy.title, 18, 35);
    const pct = Math.max(0, b.enemy.hp / b.enemy.maxHp);
    px(ctx, 18, 41, 168, 8, '#334155');
    px(ctx, 18, 41, Math.floor(168 * pct), 8, pct > 0.4 ? '#22c55e' : '#f43f5e');

    // Active Ally Portrait
    const actor = state.party[b.turnIdx] || state.party[0];
    const ap = getPortrait(actor.id, 'intense');
    ctx.drawImage(ap, 36, 102, 64, 64);

    // Party Status Panel
    px(ctx, 196, 108, 176, 60, '#140e29');
    ctx.strokeStyle = '#9b5cff';
    ctx.strokeRect(196.5, 108.5, 175, 59);
    ctx.font = '9px monospace';
    state.party.forEach((m, i) => {
      const y = 121 + i * 13;
      ctx.fillStyle = i === b.turnIdx ? '#f7c948' : '#e2e8f0';
      ctx.fillText((i === b.turnIdx ? '▶' : ' ') + m.name.slice(0, 7), 200, y);
      ctx.fillStyle = m.hp > 0 ? '#4ade80' : '#f43f5e';
      ctx.fillText(`HP:${m.hp}`, 262, y);
      ctx.fillStyle = '#38bdf8';
      ctx.fillText(`MP:${m.mp}`, 318, y);
    });

    if (b.floatText) {
      ctx.fillStyle = b.floatText.color;
      ctx.font = 'bold 13px monospace';
      ctx.fillText(b.floatText.text, b.floatText.x, b.floatText.y);
    }
    ctx.restore();

    // Bottom Battle Menu
    px(ctx, 0, 174, CW, 82, '#0b0816');
    ctx.strokeStyle = '#9b5cff';
    ctx.strokeRect(1, 175, CW - 2, 80);

    ctx.fillStyle = '#f8fafc';
    ctx.font = '9.5px monospace';
    wrapText(b.log, 12, 192, 184, 12);

    ctx.strokeStyle = '#475569';
    ctx.strokeRect(202.5, 180.5, 172, 68);

    if (b.phase === 'menu') {
      ['FIGHT', 'SKILLS', 'SOUL FUSE', 'GUARD'].forEach((opt, i) => {
        const ox = 210 + (i % 2) * 84;
        const oy = 203 + Math.floor(i / 2) * 26;
        ctx.fillStyle = b.cursor === i ? '#f7c948' : '#cbd5e1';
        ctx.font = 'bold 9.5px monospace';
        ctx.fillText((b.cursor === i ? '▶' : ' ') + opt, ox, oy);
      });
    } else if (b.phase === 'skill') {
      actor.skills.forEach((sk, i) => {
        ctx.fillStyle = b.skillCursor === i ? '#f7c948' : '#cbd5e1';
        ctx.font = '8.5px monospace';
        ctx.fillText((b.skillCursor === i ? '▶' : ' ') + `${sk.name} (${sk.cost})`, 208, 196 + i * 18);
      });
    } else if (b.phase === 'win' || b.phase === 'lose') {
      ctx.fillStyle = '#f7c948';
      ctx.font = 'bold 10px monospace';
      ctx.fillText('Press A to Continue', 222, 218);
    }
  }

  function renderMenu() {
    px(ctx, 0, 0, CW, CH, 'rgba(9,6,17,0.95)');
    ctx.strokeStyle = '#9b5cff';
    ctx.lineWidth = 2;
    ctx.strokeRect(8, 8, CW - 16, CH - 16);

    ['QUESTS', 'PARTY', 'CODEX', 'SAVE'].forEach((t, i) => {
      const tx = 18 + i * 88;
      px(ctx, tx, 16, 82, 18, state.menu.tab === i ? '#9b5cff' : '#1f1636');
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 9.5px monospace';
      ctx.fillText(t, tx + 18, 28);
    });

    ctx.font = '9.5px monospace';
    if (state.menu.tab === 0) {
      const q = QUESTS[state.questId];
      ctx.fillStyle = '#f7c948'; ctx.fillText(q.act, 20, 56);
      ctx.fillStyle = '#fff'; ctx.font = 'bold 12px monospace'; ctx.fillText(q.title, 20, 74);
      ctx.font = '9.5px monospace'; ctx.fillStyle = '#cbd5e1';
      wrapText('Objective: ' + q.obj, 20, 94, 340, 14);
      ctx.fillStyle = '#94a3b8';
      ctx.fillText(`Story Progress: ${Math.min(100, Math.floor((state.questId / 11) * 100))}%`, 20, 150);
      px(ctx, 20, 158, 340, 12, '#334155');
      px(ctx, 20, 158, Math.floor(340 * Math.min(1, state.questId / 11)), 12, '#a855f7');
    } else if (state.menu.tab === 1) {
      state.party.forEach((m, i) => {
        const y = 48 + i * 46;
        ctx.drawImage(getPortrait(m.id, 'neutral'), 20, y, 36, 36);
        ctx.fillStyle = CHAR_PROFILES[m.id].accent;
        ctx.font = 'bold 10px monospace';
        ctx.fillText(`${m.name} — ${m.title}`, 64, y + 13);
        ctx.fillStyle = '#cbd5e1';
        ctx.font = '9px monospace';
        ctx.fillText(`HP ${m.hp}/${m.maxHp}  MP ${m.mp}/${m.maxMp}  PL ${m.pl}`, 64, y + 28);
      });
    } else if (state.menu.tab === 2) {
      ctx.fillStyle = '#f7c948'; ctx.fillText('Reaperian Texts of Purgatory (Up/Down):', 20, 52);
      const id = state.unlockedCodex[state.menu.subIdx] || state.unlockedCodex[0];
      const entry = CODEX.find(e => e.id === id);
      state.unlockedCodex.forEach((cid, idx) => {
        const ce = CODEX.find(e => e.id === cid);
        ctx.fillStyle = idx === state.menu.subIdx ? '#f7c948' : '#94a3b8';
        ctx.fillText((idx === state.menu.subIdx ? '▶ ' : '  ') + ce.title, 20, 70 + idx * 13);
      });
      if (entry) {
        px(ctx, 18, 164, 348, 64, '#1e1633');
        ctx.fillStyle = '#e2e8f0';
        wrapText(entry.text, 24, 179, 336, 12);
      }
    } else if (state.menu.tab === 3) {
      ['Save Game to Device', 'Load Saved Game', 'Start New Game'].forEach((a, i) => {
        ctx.fillStyle = state.menu.subIdx === i ? '#f7c948' : '#cbd5e1';
        ctx.fillText((state.menu.subIdx === i ? '▶ ' : '  ') + a, 28, 74 + i * 26);
      });
      if (state.menu.msg) { ctx.fillStyle = '#4ade80'; ctx.fillText(state.menu.msg, 28, 170); }
    }

    ctx.fillStyle = '#94a3b8';
    ctx.font = '8.5px monospace';
    ctx.fillText('Left/Right: Tab   A: Select   B/MENU: Close', 20, 240);
  }

  function renderTitle() {
    const g = ctx.createLinearGradient(0, 0, 0, CH);
    g.addColorStop(0, '#1e0b38');
    g.addColorStop(1, '#05030a');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, CW, CH);

    for (let i = 0; i < 30; i++) {
      px(ctx, (i * 53) % CW, (i * 31) % 150, 2, 2, (state.tick + i * 7) % 40 < 20 ? '#fef08a' : '#64748b');
    }

    // Crescent Moon
    ctx.fillStyle = '#f7c948';
    ctx.beginPath(); ctx.arc(CW / 2, 58, 22, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#190a30';
    ctx.beginPath(); ctx.arc(CW / 2 + 9, 54, 20, 0, Math.PI * 2); ctx.fill();

    // Featured Portraits on Title Screen
    ctx.drawImage(getPortrait('jacob', 'neutral'), 34, 140, 48, 48);
    ctx.drawImage(getPortrait('letonin', 'happy'), 302, 140, 48, 48);

    ctx.textAlign = 'center';
    ctx.fillStyle = '#f8fafc';
    ctx.font = 'bold 18px monospace';
    ctx.fillText('LEGENDS OF DEATH', CW / 2, 112);
    ctx.fillStyle = '#c084fc';
    ctx.font = 'bold 11px monospace';
    ctx.fillText('AND THE REAPERS OF TIME', CW / 2, 129);
    ctx.fillStyle = '#94a3b8';
    ctx.font = '9px monospace';
    ctx.fillText('32-Bit GBA Portable Edition', CW / 2, 152);

    if (state.tick % 40 < 26) {
      ctx.fillStyle = '#f7c948';
      ctx.font = 'bold 12px monospace';
      ctx.fillText('PRESS [A] OR TAP TO START', CW / 2, 212);
    }
    ctx.textAlign = 'left';
  }

  function renderEpilogue() {
    px(ctx, 0, 0, CW, CH, '#090616');
    for (let i = 0; i < 32; i++) px(ctx, (i * 41) % CW, (i * 23) % 120, 2, 2, '#fef08a');

    const slides = [
      { title: 'EPILOGUE: REST; RESET; START', text: 'Months later, Senior Year begins in Colorado Springs. A new transfer student named Letonin borrows a pencil from Jacob in Calculus...' },
      { title: 'UNDER THE NIGHT SKY', text: 'Though their memories of Purgatorio were erased, their spirits still recognize each other. Under the stars, they fall in love all over again.' },
      { title: 'THE END', text: 'Thank you for playing Legends of Death & the Reapers of Time! Press [A] to explore Colorado Springs, or [B] for New Game+.' }
    ];
    const s = slides[Math.min(slides.length - 1, state.epilogueStep)];

    ctx.drawImage(getPortrait('jacob', 'happy'), 120, 148, 52, 52);
    ctx.drawImage(getPortrait('letonin', 'blush'), 212, 148, 52, 52);

    ctx.textAlign = 'center';
    ctx.fillStyle = '#f7c948';
    ctx.font = 'bold 13px monospace';
    ctx.fillText(s.title, CW / 2, 54);
    ctx.textAlign = 'left';

    ctx.fillStyle = '#f8fafc';
    ctx.font = '10px monospace';
    wrapText(s.text, 34, 80, CW - 68, 15);

    ctx.textAlign = 'center';
    ctx.fillStyle = '#c084fc';
    ctx.font = 'bold 10px monospace';
    ctx.fillText('Press [A] or Tap to Continue', CW / 2, 232);
    ctx.textAlign = 'left';
  }

  function render() {
    ctx.clearRect(0, 0, CW, CH);
    if (state.mode === 'title') renderTitle();
    else if (state.mode === 'epilogue') renderEpilogue();
    else if (state.mode === 'battle') renderBattle();
    else {
      renderExplore();
      if (state.mode === 'dialogue') renderDialogue();
      if (state.mode === 'menu') renderMenu();
    }

    if (state.fade.active && state.fade.alpha > 0) {
      px(ctx, 0, 0, CW, CH, `rgba(0,0,0,${Math.min(1, state.fade.alpha)})`);
    }
  }

  /* =========================================================================
     16. HUD SYNC & MAIN LOOP
     ========================================================================= */
  const hudArea  = document.getElementById('hudArea');
  const hudQuest = document.getElementById('hudQuest');
  const hudRealm = document.getElementById('hudRealm');
  const hudHp    = document.getElementById('hudHp');

  function updateHUD() {
    const map = MAPS[state.mapId];
    const q = QUESTS[state.questId];
    const lead = state.party[0];
    hudArea.textContent = map.name;
    hudQuest.textContent = `${q.act.split(':')[0]}: ${q.obj}`;
    hudHp.textContent = `HP ${lead.hp}/${lead.maxHp}`;

    hudRealm.className = 'realm-badge';
    if (state.realm === 'purgatorio') { hudRealm.textContent = 'PURGATORIO'; hudRealm.classList.add('purgatorio'); }
    else if (state.realm === 'dream') { hudRealm.textContent = 'DREAM REALM'; hudRealm.classList.add('dream'); }
    else if (state.realm === 'bloodmoon') { hudRealm.textContent = 'BLOOD MOON'; hudRealm.classList.add('bloodmoon'); }
    else { hudRealm.textContent = 'HUMAN REALM'; }
  }

  function loop() {
    update();
    render();
    requestAnimationFrame(loop);
  }

  refreshNPCs();
  updateHUD();
  loop();
})();
</script>
</body>
</html>
